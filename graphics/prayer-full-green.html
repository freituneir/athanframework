<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer App - Phthalo Green</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    font-family: 'DM Sans', sans-serif;
    padding: 20px;
    gap: 40px;
  }

  .section-label {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }

  /* =================== FULL APP =================== */
  .phone-frame {
    width: 393px;
    background: #050505;
    border-radius: 48px;
    padding: 16px;
    box-shadow: 0 0 0 2px #222, 0 40px 80px rgba(0,0,0,0.6);
    position: relative;
  }

  .screen {
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(165deg, #0a2e2a 0%, #072420 40%, #051a17 100%);
    min-height: 600px;
  }

  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(125, 232, 201, 0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(60, 191, 160, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }

  .geo-accent {
    position: absolute;
    top: 60px;
    right: -20px;
    width: 200px;
    height: 200px;
    opacity: 0.04;
    z-index: 1;
  }

  .geo-accent svg { width: 100%; height: 100%; }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 8px;
    position: relative;
    z-index: 2;
  }

  .status-time {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.3px;
  }

  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .status-icons span {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }

  .content {
    padding: 40px 28px;
    position: relative;
    z-index: 2;
  }

  .date-section { margin-bottom: 48px; }

  .date-gregorian {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    color: rgba(255,255,255,0.92);
    line-height: 1.05;
    letter-spacing: -0.5px;
  }

  .date-hijri {
    font-size: 13px;
    font-weight: 300;
    color: rgba(125, 232, 201, 0.6);
    margin-top: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Widget card */
  .widget {
    background: rgba(125, 232, 201, 0.03);
    border: 1px solid rgba(125, 232, 201, 0.06);
    border-radius: 24px;
    padding: 28px;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    animation: fadeSlideIn 0.8s ease-out;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .widget::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(125, 232, 201, 0.25), transparent);
  }

  .widget-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
  }

  .prayer-label {
    font-size: 11px;
    font-weight: 500;
    color: rgba(125, 232, 201, 0.5);
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .prayer-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 400;
    color: rgba(255,255,255,0.95);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .prayer-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sunset-icon {
    position: relative;
    width: 36px;
    height: 36px;
  }

  .sunset-icon .sun {
    width: 16px;
    height: 16px;
    background: radial-gradient(circle, rgba(125, 232, 201, 0.9), rgba(58, 175, 138, 0.6));
    border-radius: 50%;
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 16px rgba(125, 232, 201, 0.3);
    animation: sunPulse 3s ease-in-out infinite;
  }

  @keyframes sunPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(125, 232, 201, 0.3); }
    50% { box-shadow: 0 0 24px rgba(125, 232, 201, 0.5); }
  }

  .sunset-icon .horizon {
    position: absolute;
    bottom: 10px;
    left: 2px;
    right: 2px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(125, 232, 201, 0.5), transparent);
  }

  .countdown-section {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 20px;
  }

  .countdown-digits {
    font-family: 'Cormorant Garamond', serif;
    font-size: 64px;
    font-weight: 300;
    color: rgba(255,255,255,0.95);
    letter-spacing: -2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .countdown-unit {
    font-size: 12px;
    font-weight: 300;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-left: 4px;
  }

  .progress-bar {
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 65%;
    background: linear-gradient(90deg, rgba(125, 232, 201, 0.6), rgba(58, 175, 138, 0.2));
    border-radius: 2px;
    animation: progressGrow 1.2s ease-out;
  }

  @keyframes progressGrow {
    from { width: 0; }
    to { width: 65%; }
  }

  .prayer-time-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .prayer-actual-time {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
  }

  .prayer-actual-time span { color: rgba(255,255,255,0.6); }

  .done-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: rgba(125, 232, 201, 0.1);
    border: 1px solid rgba(125, 232, 201, 0.12);
    border-radius: 100px;
    color: rgba(125, 232, 201, 0.85);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }

  .done-btn:hover {
    background: rgba(125, 232, 201, 0.18);
    border-color: rgba(125, 232, 201, 0.25);
  }

  .done-btn svg { width: 14px; height: 14px; }

  /* Next prayers */
  .next-prayers {
    margin-top: 24px;
    padding: 24px 28px;
    position: relative;
    z-index: 2;
  }

  .next-label {
    font-size: 10px;
    font-weight: 500;
    color: rgba(255,255,255,0.25);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .prayer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    animation: fadeIn 0.6s ease-out both;
  }

  .prayer-row:last-child { border-bottom: none; }
  .prayer-row:nth-child(2) { animation-delay: 0.1s; }
  .prayer-row:nth-child(3) { animation-delay: 0.2s; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .prayer-row-name {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.3px;
  }

  .prayer-row-time {
    font-size: 13px;
    font-weight: 300;
    color: rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
  }

  .prayer-row.completed .prayer-row-name,
  .prayer-row.completed .prayer-row-time {
    color: rgba(255,255,255,0.15);
    text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,0.08);
  }

  /* =================== LIVE ACTIVITY WIDGET =================== */
  .widget-column {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .lockscreen {
    width: 393px;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(10, 46, 42, 0.8), transparent 70%),
      radial-gradient(ellipse at 30% 70%, rgba(7, 36, 32, 0.6), transparent 60%),
      linear-gradient(180deg, #050e0c 0%, #071a17 100%);
    border-radius: 48px;
    padding: 60px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 2px #222, 0 40px 80px rgba(0,0,0,0.6);
  }

  .lockscreen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .ls-time {
    font-size: 72px;
    font-weight: 600;
    color: white;
    letter-spacing: -2px;
    line-height: 1;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .ls-date {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,0.6);
    margin-top: -8px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* Live Activity */
  .live-activity {
    width: 361px;
    background: rgba(20, 50, 44, 0.75);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-radius: 22px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: -apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .la-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .la-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, #0a2e2a, #051a17);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .app-icon::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, rgba(125, 232, 201, 0.9), rgba(58, 175, 138, 0.5));
    border-radius: 50%;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(125, 232, 201, 0.4);
  }

  .app-icon::before {
    content: '';
    position: absolute;
    bottom: 9px;
    left: 5px;
    right: 5px;
    height: 1px;
    background: rgba(125, 232, 201, 0.4);
    z-index: 1;
  }

  .la-prayer-info { display: flex; flex-direction: column; }

  .la-prayer-name {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.95);
    line-height: 1.2;
  }

  .la-prayer-subtext {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.4);
    line-height: 1.3;
  }

  .la-countdown {
    font-size: 34px;
    font-weight: 300;
    color: rgba(255,255,255,0.95);
    letter-spacing: -1.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .la-progress {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .la-progress-fill {
    height: 100%;
    width: 65%;
    border-radius: 4px;
    background: linear-gradient(90deg, #7de8c9, #3aaf8a);
    transition: width 1s linear;
  }

  .la-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .la-adhan-time {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
  }

  .la-adhan-time span { color: rgba(255,255,255,0.55); }

  .la-done-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 7px 16px;
    background: rgba(125, 232, 201, 0.12);
    border: none;
    border-radius: 100px;
    color: rgba(125, 232, 201, 0.9);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: inherit;
  }

  .la-done-btn:hover { background: rgba(125, 232, 201, 0.2); }

  .la-done-btn svg { width: 13px; height: 13px; stroke-width: 2.5; }

  /* Compact */
  .la-compact-label {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 20px;
    margin-bottom: 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .live-activity.compact { padding: 14px 18px; }
  .compact .la-top { margin-bottom: 0; }
  .compact .la-countdown { font-size: 28px; }

  .notif-dots {
    display: flex;
    gap: 6px;
    margin-top: 30px;
  }

  .notif-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
  }

  /* =================== LAYOUT =================== */
  .page-layout {
    display: flex;
    gap: 48px;
    align-items: flex-start;
  }
</style>
</head>
<body>

<div class="page-layout">

  <!-- FULL APP -->
  <div>
    <div class="section-label">Full App</div>
    <div class="phone-frame">
      <div class="screen">
        <div class="geo-accent">
          <svg viewBox="0 0 200 200" fill="none">
            <circle cx="100" cy="100" r="80" stroke="white" stroke-width="0.5"/>
            <circle cx="100" cy="100" r="60" stroke="white" stroke-width="0.3"/>
            <circle cx="100" cy="100" r="40" stroke="white" stroke-width="0.3"/>
            <polygon points="100,20 180,100 100,180 20,100" stroke="white" stroke-width="0.3" fill="none"/>
            <polygon points="100,40 160,100 100,160 40,100" stroke="white" stroke-width="0.3" fill="none"/>
          </svg>
        </div>

        <div class="status-bar">
          <span class="status-time">5:26</span>
          <div class="status-icons">
            <span>&#9679;</span>
            <span>&#9679;</span>
            <span>&#9679;</span>
          </div>
        </div>

        <div class="content">
          <div class="date-section">
            <div class="date-gregorian">Monday<br>February 16</div>
            <div class="date-hijri">18 Sha'ban 1447</div>
          </div>

          <div class="widget">
            <div class="widget-header">
              <div>
                <div class="prayer-label">Next Prayer</div>
                <div class="prayer-name">Maghrib</div>
              </div>
              <div class="prayer-icon">
                <div class="sunset-icon">
                  <div class="sun"></div>
                  <div class="horizon"></div>
                </div>
              </div>
            </div>

            <div class="countdown-section">
              <span class="countdown-digits" id="countdown-app">2:34</span>
              <span class="countdown-unit">remaining</span>
            </div>

            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>

            <div class="prayer-time-row">
              <div class="prayer-actual-time">Adhan at <span>5:32 PM</span></div>
              <button class="done-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                Done
              </button>
            </div>
          </div>
        </div>

        <div class="next-prayers">
          <div class="next-label">Today's Prayers</div>
          <div class="prayer-row completed">
            <span class="prayer-row-name">Fajr</span>
            <span class="prayer-row-time">5:48 AM</span>
          </div>
          <div class="prayer-row completed">
            <span class="prayer-row-name">Dhuhr</span>
            <span class="prayer-row-time">12:15 PM</span>
          </div>
          <div class="prayer-row completed">
            <span class="prayer-row-name">Asr</span>
            <span class="prayer-row-time">3:02 PM</span>
          </div>
          <div class="prayer-row">
            <span class="prayer-row-name">Isha</span>
            <span class="prayer-row-time">7:05 PM</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- LIVE ACTIVITY WIDGETS -->
  <div>
    <div class="section-label">Live Activity</div>
    <div class="lockscreen">
      <div class="ls-time">5:26</div>
      <div class="ls-date">Monday, February 16</div>

      <!-- Expanded -->
      <div class="live-activity">
        <div class="la-top">
          <div class="la-left">
            <div class="app-icon"></div>
            <div class="la-prayer-info">
              <div class="la-prayer-name">Maghrib Prayer</div>
              <div class="la-prayer-subtext">Adhan at <span>5:32 PM</span></div>
            </div>
          </div>
          <span class="la-countdown" id="countdown-la">2:34</span>
        </div>

        <div style="margin-top: 14px;">
          <div class="la-progress">
            <div class="la-progress-fill"></div>
          </div>

          <div class="la-bottom">
            <div class="la-adhan-time">Isha at <span>7:05 PM</span></div>
            <button class="la-done-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Done
            </button>
          </div>
        </div>
      </div>

      <!-- Compact -->
      <div class="la-compact-label">Compact</div>
      <div class="live-activity compact">
        <div class="la-top">
          <div class="la-left">
            <div class="app-icon"></div>
            <div class="la-prayer-info">
              <div class="la-prayer-name">Maghrib</div>
            </div>
          </div>
          <span class="la-countdown" id="countdown-compact">2:34</span>
        </div>
      </div>

      <div class="notif-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

</div>

<script>
  let totalSeconds = 2 * 60 + 34;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  setInterval(() => {
    if (totalSeconds > 0) {
      totalSeconds--;
      const t = formatTime(totalSeconds);
      document.getElementById('countdown-app').textContent = t;
      document.getElementById('countdown-la').textContent = t;
      document.getElementById('countdown-compact').textContent = t;
    }
  }, 1000);
</script>

</body>
</html>
