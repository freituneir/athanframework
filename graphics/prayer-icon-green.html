<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer App Icon - Phthalo Green</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    gap: 60px;
    padding: 40px;
  }

  .showcase {
    display: flex;
    align-items: flex-end;
    gap: 40px;
  }

  .icon-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .icon-label {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .icon-container {
    border-radius: 22.37%;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .icon-container.large {
    width: 200px;
    height: 200px;
  }

  .icon-container.medium {
    width: 120px;
    height: 120px;
  }

  .icon-container.small {
    width: 60px;
    height: 60px;
  }

  .icon-container svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .app-label {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="showcase">
  <!-- Large -->
  <div class="icon-wrap">
    <div class="icon-label">1024px</div>
    <div class="icon-container large">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a2e2a"/>
            <stop offset="50%" stop-color="#072420"/>
            <stop offset="100%" stop-color="#051a17"/>
          </linearGradient>

          <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#7de8c9" stop-opacity="0.3"/>
            <stop offset="60%" stop-color="#3cbfa0" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#1a9a78" stop-opacity="0"/>
          </radialGradient>

          <radialGradient id="sunBody" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#a0f0d8"/>
            <stop offset="40%" stop-color="#6dddb8"/>
            <stop offset="100%" stop-color="#3aaf8a"/>
          </radialGradient>

          <linearGradient id="horizonGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4dcba5" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#4dcba5" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="archGrad" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#7de8c9" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#2e9478" stop-opacity="0.3"/>
          </linearGradient>

          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
            <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
            <feComponentTransfer>
              <feFuncA type="linear" slope="0.03"/>
            </feComponentTransfer>
            <feBlend in="SourceGraphic" mode="normal"/>
          </filter>
        </defs>

        <!-- Background -->
        <rect width="512" height="512" fill="url(#bg)"/>

        <!-- Ambient glow -->
        <ellipse cx="256" cy="260" rx="180" ry="140" fill="url(#sunGlow)"/>

        <!-- Horizon warm wash -->
        <rect x="0" y="290" width="512" height="222" fill="url(#horizonGrad)"/>

        <!-- Mihrab arch -->
        <g opacity="0.9">
          <path d="
            M 176 400
            L 176 240
            Q 176 170, 256 150
            Q 336 170, 336 240
            L 336 400
          " fill="none" stroke="url(#archGrad)" stroke-width="3"/>

          <path d="
            M 200 400
            L 200 255
            Q 200 195, 256 178
            Q 312 195, 312 255
            L 312 400
          " fill="none" stroke="url(#archGrad)" stroke-width="1.5" opacity="0.5"/>

          <circle cx="256" cy="158" r="4" fill="none" stroke="url(#archGrad)" stroke-width="1.2" opacity="0.6"/>
        </g>

        <!-- Sun disc -->
        <circle cx="256" cy="240" r="36" fill="url(#sunBody)"/>

        <!-- Sun outer ring -->
        <circle cx="256" cy="240" r="44" fill="none" stroke="#7de8c9" stroke-width="0.8" opacity="0.25"/>

        <!-- Horizon line -->
        <line x1="80" y1="320" x2="432" y2="320" stroke="#5ddbb0" stroke-width="1.2" opacity="0.35"/>

        <!-- Decorative dots -->
        <circle cx="140" cy="320" r="2" fill="#5ddbb0" opacity="0.2"/>
        <circle cx="200" cy="320" r="1.5" fill="#5ddbb0" opacity="0.15"/>
        <circle cx="312" cy="320" r="1.5" fill="#5ddbb0" opacity="0.15"/>
        <circle cx="372" cy="320" r="2" fill="#5ddbb0" opacity="0.2"/>

        <!-- Crescent moon -->
        <g transform="translate(370, 130)" opacity="0.3">
          <circle cx="0" cy="0" r="14" fill="#7de8c9"/>
          <circle cx="5" cy="-4" r="12" fill="#082a25"/>
        </g>

        <!-- Star accents -->
        <circle cx="150" cy="140" r="1.5" fill="#7de8c9" opacity="0.2"/>
        <circle cx="180" cy="110" r="1" fill="#7de8c9" opacity="0.15"/>
        <circle cx="390" cy="170" r="1" fill="#7de8c9" opacity="0.15"/>
        <circle cx="130" cy="180" r="1" fill="#7de8c9" opacity="0.12"/>

        <!-- Noise -->
        <rect width="512" height="512" fill="transparent" filter="url(#noise)" opacity="0.5"/>
      </svg>
    </div>
    <div class="app-label">Salah</div>
  </div>

  <!-- Medium -->
  <div class="icon-wrap">
    <div class="icon-label">120px</div>
    <div class="icon-container medium">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a2e2a"/>
            <stop offset="50%" stop-color="#072420"/>
            <stop offset="100%" stop-color="#051a17"/>
          </linearGradient>
          <radialGradient id="sunGlow2" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#7de8c9" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#3cbfa0" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="sunBody2" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#a0f0d8"/>
            <stop offset="40%" stop-color="#6dddb8"/>
            <stop offset="100%" stop-color="#3aaf8a"/>
          </radialGradient>
          <linearGradient id="archGrad2" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#7de8c9" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#2e9478" stop-opacity="0.3"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" fill="url(#bg2)"/>
        <ellipse cx="256" cy="260" rx="180" ry="140" fill="url(#sunGlow2)"/>
        <path d="M 176 400 L 176 240 Q 176 170, 256 150 Q 336 170, 336 240 L 336 400" fill="none" stroke="url(#archGrad2)" stroke-width="4"/>
        <circle cx="256" cy="240" r="38" fill="url(#sunBody2)"/>
        <line x1="80" y1="320" x2="432" y2="320" stroke="#5ddbb0" stroke-width="1.5" opacity="0.35"/>
        <g transform="translate(370, 130)" opacity="0.3">
          <circle cx="0" cy="0" r="14" fill="#7de8c9"/>
          <circle cx="5" cy="-4" r="12" fill="#082a25"/>
        </g>
      </svg>
    </div>
    <div class="app-label">Salah</div>
  </div>

  <!-- Small -->
  <div class="icon-wrap">
    <div class="icon-label">60px</div>
    <div class="icon-container small">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a2e2a"/>
            <stop offset="50%" stop-color="#072420"/>
            <stop offset="100%" stop-color="#051a17"/>
          </linearGradient>
          <radialGradient id="sunGlow3" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#7de8c9" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#3cbfa0" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="sunBody3" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#a0f0d8"/>
            <stop offset="100%" stop-color="#3aaf8a"/>
          </radialGradient>
          <linearGradient id="archGrad3" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#7de8c9" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#2e9478" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" fill="url(#bg3)"/>
        <ellipse cx="256" cy="260" rx="160" ry="120" fill="url(#sunGlow3)"/>
        <path d="M 176 400 L 176 240 Q 176 170, 256 150 Q 336 170, 336 240 L 336 400" fill="none" stroke="url(#archGrad3)" stroke-width="8"/>
        <circle cx="256" cy="240" r="42" fill="url(#sunBody3)"/>
        <line x1="90" y1="320" x2="422" y2="320" stroke="#5ddbb0" stroke-width="2.5" opacity="0.4"/>
      </svg>
    </div>
    <div class="app-label">Salah</div>
  </div>
</div>

</body>
</html>
